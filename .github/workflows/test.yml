---
name: test with cypress
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # run the ci equivalent of npm install
      - name: npm ci
        run: |
          npm ci
          npm run dist
          npx http-server -p 8080 docs/.vitepress/dist > /dev/null 2>&1 &
          ./node_modules/.bin/wait-on -v -t 10s http://127.0.0.1:8080

      - name: Install Node.js for cypress
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'e2e/.nvmrc'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - uses: cypress-io/github-action@v7
        with:
          working-directory: e2e
 
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypress-video
          path: e2e/cypress/videos/home.cy.js.mp4
          archive: false
